version: 2

models:
  - name: intercom__admin_metrics
    description: >
      Each record represents an individual admin (employee) and a unique team they are assigned on,
      enriched with admin-specific conversation aggregates.
    columns:
      - name: admin_id
        description: The unique identifier representing the admin.
      - name: admin_name
        description: The name of the admin.
      - name: team_name
        description: The team ID the admin is associated with.
      - name: job_title
        description: The admin job title.
      - name: total_conversations_closed
        description: The admin's sum of total closed conversations.
      - name: average_conversation_parts
        description: The admin's average number of parts associated with a single conversation.
      - name: average_conversation_rating
        description: The admin's total average rating given to conversations they closed.
      - name: median_conversations_reopened
        description: The admin's median value of times they reopened conversations.
      - name: median_conversation_assignments
        description: The admin's median value of times they closed a conversation and had other assignees.
      - name: median_time_to_first_response_time_minutes
        description: The admin's median time to first response on a conversation.
      - name: median_time_to_last_close_minutes
        description: The admin's median time to last closure of a conversation.

  - name: intercom__companies
    description: >
      Each record represents a single company, enriched with data related to industry, monthly spend, and user count.
    columns:
      - name: company_id
        description: Unique identifier representing the company.
        tests:
          - not_null
          - unique
      - name: company_name
        description: The name of the company.
      - name: created_at_timestamp
        description: The time the company was created.
      - name: website
        description: The company website.
      - name: industry
        description: The industry the company operates in.
      - name: monthly_spend
        description: Monthly revenue generated by the company.
      - name: user_count
        description: Total count of users associated with the company.
      - name: session_count
        description: Count of sessions recorded for the company.
      - name: plan_id
        description: Unique identifier representing the company plan.
      - name: plan_name
        description: The name of the plan associated with the company.
      - name: updated_at_timestamp
        description: The time the company was last updated.

  - name: intercom__contacts
    description: >
      Each record represents a single contact, enriched with role, subscription status, and company association.
    columns:
      - name: contact_id
        description: Unique identifier for the contact.
        tests:
          - not_null
          - unique
      - name: contact_name
        description: The contact's name.
      - name: admin_id
        description: Admin assigned ownership of the contact.
      - name: created_at_timestamp
        description: Time when the contact was created.
      - name: updated_at_timestamp
        description: Time when the contact was last updated.
      - name: signed_up_at_timestamp
        description: Time the contact signed up.
      - name: email
        description: The contact's email.
      - name: phone
        description: The contact's phone number.
      - name: last_contacted_at
        description: Last time the contact was messaged.
      - name: last_email_opened_at
        description: Last time the contact opened an email.
      - name: last_email_clicked_at
        description: Last time the contact clicked a link in an email.
      - name: last_replied_at
        description: Last time the contact replied.
      - name: is_unsubscribed_from_emails
        description: Whether the contact unsubscribed from emails.
      - name: all_contact_company_names
        description: Aggregation of all companies the contact is associated with.

  - name: intercom__conversations
    description: >
      Each record represents a single conversation, enriched with data from conversation parts.
    columns:
      - name: conversation_id
        description: Unique identifier for the conversation.
        tests:
          - not_null
          - unique
      - name: conversation_created_at
        description: Time the conversation was created.
      - name: conversation_last_updated_at
        description: Time the conversation was last updated.
      - name: conversation_type
        description: Type of conversation (push, facebook, twitter, email).
      - name: conversation_title
        description: Title of the conversation.
      - name: first_close_by_admin_id
        description: Admin who first closed the conversation.
      - name: last_closed_by_id
        description: Admin who last closed the conversation.
      - name: first_contact_author_id
        description: Contact who first authored the conversation.
      - name: last_contact_author_id
        description: Contact who last authored the conversation before closing.
      - name: conversation_state
        description: Current state (open/close).
      - name: is_read
        description: Whether the conversation message has been read.

  - name: intercom__conversation_metrics
    description: >
      Each record represents a conversation enriched with aggregates like time to first response and time to close.
    columns:
      - name: conversation_id
        description: Unique identifier for the conversation.
        tests:
          - not_null
          - unique
      - name: count_reopens
        description: Count of times the conversation was reopened.
      - name: count_total_parts
        description: Total number of parts in the conversation.
      - name: count_assignments
        description: Count of assignments in the conversation.
      - name: time_to_first_response_minutes
        description: Time difference between creation and first admin response.
      - name: time_to_last_close_minutes
        description: Time difference between creation and last close.
      - name: conversation_state
        description: Current state (open/close).
      - name: conversation_rating
        description: Optional rating (1–5).
      - name: conversation_remark
        description: Optional remark corresponding to rating.

sources:
  - name: airbyte_intercom
    schema: "{{ var('intercom_schema', 'intercom') }}"
    database: "{% if target.type != 'spark' %}{{ var('intercom_database', target.database) }}{% endif %}"
    tables:
      - name: admins
      - name: companies
      - name: contacts
      - name: conversation_parts
      - name: conversations