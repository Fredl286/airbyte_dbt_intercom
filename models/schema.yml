version: 2

models:
  - name: fct_intercom__admin_metrics
    description: >
      Each record represents an individual admin enriched with admin-specific conversation aggregates.
    columns:
      - name: admin_id
        description: The unique identifier representing the admin.
      - name: admin_name
        description: The name of the admin.
      - name: job_title
        description: The admin job title.
      - name: total_conversations_closed
        description: The admin's sum of total closed conversations.
      - name: average_conversation_parts
        description: The admin's average number of parts associated with a single conversation.
      - name: average_conversation_rating
        description: The admin's total average rating given to conversations they closed.
      - name: median_conversations_reopened
        description: The admin's median value of times they reopened conversations.
      - name: median_conversation_assignments
        description: The admin's median value of times they closed a conversation and had other assignees.
      - name: median_time_to_first_response_time_minutes
        description: The admin's median time to first response on a conversation.
      - name: median_time_to_last_close_minutes
        description: The admin's median time to last closure of a conversation.

  - name: dim_intercom__contacts
    description: >
      Each record represents the latest snapshot of a single contact.
    columns:
      - name: contact_id
        description: Unique identifier for the contact.
        tests:
          - not_null
          - unique
      - name: name
        description: The contact name.
      - name: created_at_timestamp
        description: Time when the contact was created.
      - name: email
        description: The contact's email.
      - name: phone
        description: The contact's phone number.
      - name: last_seen_at_timestamp
        description: Most recent time the contact was seen.

  - name: fct_intercom__conversations
    description: >
      Each record represents a single conversation, enriched with data from conversation parts.
    columns:
      - name: conversation_id
        description: Unique identifier for the conversation.
        tests:
          - not_null
          - unique
      - name: created_at_timestamp
        description: Time the conversation was created.
      - name: updated_at_timestamp
        description: Time the conversation was last updated.
      - name: created_at_date
        description: Date when the conversation was created.
      - name: updated_at_date
        description: Date when the conversation was last updated.
      - name: conversation_type
        description: Type of conversation (push, facebook, twitter, email).
      - name: conversation_title
        description: Title of the conversation.
      - name: last_closed_by_id
        description: Admin who last closed the conversation.
      - name: conversation_rating
        description: Rating value for the conversation, if available.
      - name: conversation_remark
        description: Rating remark for the conversation, if available.
      - name: sla_name
        description: SLA policy name currently applied.
      - name: sla_status
        description: SLA status currently applied.
      - name: conversation_state
        description: Current state (open/close).
      - name: is_read
        description: Whether the conversation message has been read.

  - name: fct_intercom__conversation_metrics
    description: >
      Each record represents a conversation enriched with aggregates like time to first response and time to close.
    columns:
      - name: conversation_id
        description: Unique identifier for the conversation.
        tests:
          - not_null
          - unique
      - name: count_reopens
        description: Count of times the conversation was reopened.
      - name: count_total_parts
        description: Total number of parts in the conversation.
      - name: count_assignments
        description: Count of assignments in the conversation.
      - name: time_to_first_response_minutes
        description: Time difference between creation and first admin response.
      - name: time_to_last_close_minutes
        description: Time difference between creation and last close.
      - name: conversation_state
        description: Current state (open/close).
      - name: conversation_rating
        description: Optional rating (1–5).
      - name: conversation_remark
        description: Optional remark corresponding to rating.
      - name: last_closed_by_id
        description: Admin identifier who last closed the conversation.

  - name: fct_intercom__echo_conversations
    description: >
      Each record represents a deduplicated ECHO conversation event enriched with contact financial attributes.
    columns:
      - name: conversation_id
        description: Unique identifier for the conversation.
      - name: contact_id
        description: Contact ID from the conversations payload.
      - name: started_at
        description: Timestamp when Started ECHO Main was tagged.
      - name: completed_at
        description: Timestamp when Completed ECHO main was tagged.
      - name: d2a_flag
        description: Indicator that a D2A split-test tag is present for the conversation.
      - name: tags_applied
        description: Comma-separated list of applied tags.
      - name: vulcan_id
        description: Vulcan ID from custom attributes (blank if missing).

  - name: dim_intercom__admins
    description: >
      Each record represents a single Intercom admin (agent) with their profile and availability attributes.
    columns:
      - name: admin_id
        description: Unique identifier for the admin.
        tests:
          - not_null
          - unique
      - name: admin_name
        description: Full name of the admin.
      - name: admin_type
        description: Type of admin (admin or team).
      - name: email
        description: Email address of the admin.
      - name: job_title
        description: Job title of the admin.
      - name: has_inbox_seat
        description: Whether the admin has an inbox seat assigned.
      - name: away_mode_enabled
        description: Whether the admin is currently in away mode.
      - name: away_mode_reassign
        description: Whether conversations are reassigned when the admin is away.
      - name: team_ids
        description: Array of team IDs the admin belongs to.
      - name: avatar
        description: Avatar object for the admin.

  - name: dim_intercom__teams
    description: >
      Each record represents a single Intercom team with its member admin IDs.
    columns:
      - name: team_id
        description: Unique identifier for the team.
        tests:
          - not_null
          - unique
      - name: team_name
        description: Name of the team.
      - name: team_type
        description: Type value for the team object.
      - name: admin_ids
        description: Array of admin IDs that are members of this team.

  - name: dim_intercom__segments
    description: >
      Each record represents a single Intercom segment (a saved filter group of contacts or users).
    columns:
      - name: segment_id
        description: Unique identifier for the segment.
        tests:
          - not_null
          - unique
      - name: segment_name
        description: Name of the segment.
      - name: segment_type
        description: Type of segment.
      - name: member_count
        description: Number of contacts/users in the segment.
      - name: person_type
        description: Whether the segment applies to users or leads.
      - name: created_at_timestamp
        description: Timestamp when the segment was created.
      - name: updated_at_timestamp
        description: Timestamp when the segment was last updated.

  - name: dim_intercom__contact_attributes
    description: >
      Each record represents a single custom or standard contact attribute definition in Intercom.
    columns:
      - name: attribute_id
        description: Unique identifier for the contact attribute.
        tests:
          - not_null
          - unique
      - name: attribute_name
        description: Internal name of the attribute.
      - name: attribute_type
        description: Type classification of the attribute.
      - name: label
        description: Human-readable label for the attribute.
      - name: model
        description: The model this attribute belongs to (contact, company).
      - name: custom
        description: Whether this is a custom attribute.
      - name: data_type
        description: Data type of the attribute value (string, integer, boolean, etc.).
      - name: full_name
        description: Fully qualified name of the attribute.
      - name: description
        description: Description of the attribute.
      - name: admin_id
        description: Admin who created the attribute.
      - name: archived
        description: Whether the attribute has been archived.
      - name: ui_writable
        description: Whether the attribute can be edited via the UI.
      - name: api_writable
        description: Whether the attribute can be written via the API.
      - name: messenger_writable
        description: Whether the attribute can be set via the Messenger.
      - name: created_at_timestamp
        description: Timestamp when the attribute was created.
      - name: updated_at_timestamp
        description: Timestamp when the attribute was last updated.

sources:
  - name: airbyte_intercom
    schema: "{{ var('intercom_schema', 'intercom') }}"
    database: "{% if target.type != 'spark' %}{{ var('intercom_database', target.database) }}{% endif %}"
    tables:
      - name: admins
      - name: companies
      - name: contacts
      - name: conversation_parts
      - name: conversations
      - name: conversation_rating
      - name: conversations_sla_applied
      - name: conversations_assignee
      - name: conversations_statistics
      - name: teams
      - name: segments
      - name: contact_attributes
