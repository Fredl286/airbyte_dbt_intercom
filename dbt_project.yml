name: 'airbyte_intercom'
version: '0.1.0'
require-dbt-version: ['>=1.0.0']
config-version: 2
profile: 'default'

# Paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Build artifacts
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model configs
models: 
  airbyte_intercom: 
    +materialized: table 
    +schema: intercom_analytics   # 👈 dbt outputs go here
    tmp: 
      +materialized: view
      +schema: intercom_analytics

# Variables
vars:
  # Add your Snowflake schema + database overrides here
  intercom_schema: AIRBYTE_SCHEMA       # raw Airbyte schema
  intercom_database: AIRBYTE_DATABASE   # raw Airbyte database

  # Source definitions for the package
  airbyte_intercom:
    admins: "{{ source('airbyte_intercom','admins') }}"
    companies: "{{ source('airbyte_intercom','companies') }}"
    contacts: "{{ source('airbyte_intercom','contacts') }}"
    conversation_parts: "{{ source('airbyte_intercom','conversation_parts') }}"
    conversations: "{{ source('airbyte_intercom','conversations') }}"
